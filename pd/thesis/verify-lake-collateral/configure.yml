#=========================================================================
# verify-lake-collateral
#=========================================================================
# Cross-check the lake collateral for a memory spec across the two contexts
# that produce it and emit the agreed canonical file.
#
#   Context A: lake_collateral.json generated by the CGRA-with-lakespec build
#              (garnet's gen_rtl, using the container's lake) -- passed in.
#   Context B: regenerated here from the SAME spec_config.json using this
#              (standalone) lake checkout.
#
# The collateral is a deterministic function of the spec, so A and B must be
# identical; a mismatch means the two lake views of the spec disagree (e.g.
# lake version skew between the garnet container and the build machine, or a
# spec_config that got mis-threaded) and fails the build. The agreed collateral
# is written as lake_collateral.json for the round-trip compile downstream.

name: verify-lake-collateral

inputs:
  - lake_collateral.json      # context A (from the CGRA / garnet build)
  - spec_config.json          # the single source of truth for the spec

outputs:
  - lake_collateral.json      # the agreed, canonical collateral

commands:
  # Context B: regenerate from the same spec with THIS lake.
  - python -m lake.utils.spec_config_to_collateral
      --spec inputs/spec_config.json
      -o lake_collateral_standalone.json
  # Cross-check A vs B; writes outputs/lake_collateral.json on match, else fails.
  - mkdir -p outputs
  - python -m lake.utils.verify_collateral
      --a inputs/lake_collateral.json
      --b lake_collateral_standalone.json
      -o outputs/lake_collateral.json

postconditions:
  - assert File( 'outputs/lake_collateral.json' )
